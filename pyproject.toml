[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smbox"
version = "0.1.0"
description = "A lightweight HPO package to efficiently optimize the hyperparameters of an ML algorithm."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Tarek Salhi", email = "tareksalhi0@gmail.com" }
]
dependencies = [
  "catboost==1.2",
  "mlflow==2.7.1",
  "numpy==1.25.2",
  "openml==0.12.2",
  "pandas==2.0.3",
  "scikit-learn==1.3.0",
  "xgboost==1.7.6",
  "configparser==5.3.0",
  "brotli==1.0.9",
  "future==0.18.3",
  "munkres==1.1.4",
  "pooch==1.7.0",
  "pysocks==1.7.1",
  "typing-extensions==4.7.1"
]

[project.urls]
Homepage = "https://github.com/Tarek0/smbox"

[tool.setuptools.packages.find]
include = ["smbox*"]

[dependency-groups]
dev = [
  "pytest>=9.0.0"
]
